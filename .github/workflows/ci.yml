name: IAM policy checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python validate_iam.py fixtures/pass-plan.json --trusted-account-id 111111111111 --external-id clinic-demo-2026
      - run: |
          if python validate_iam.py fixtures/fail-plan.json --trusted-account-id 111111111111 --external-id clinic-demo-2026; then
            exit 1
          else
            test $? -eq 1
          fi
